<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <div class="clock">

            <div class="brand">VINTAGE CLOCK</div>

            <div id="time">00:00:00</div>

            <div id="period">AM</div>

            <div id="date">Monday, January 1, 2026</div>

        </div>
<!-- Alarm Section -->

<section class="alarm">

    <div class="section-title">
        ALARM
    </div>

    <div class="alarm-form">

        <input
            type="time"
            id="alarmTime"
        >

        <button id="setAlarm">
            SET ALARM
        </button>

    </div>

    <div class="alarm-status" id="alarmStatus">
        No alarm set
    </div>

    <button
        id="stopAlarm"
        class="stop-alarm"
        hidden
    >
        STOP ALARM
    </button>

</section>


        <div class="controls">
            <button id="formatBtn">12H</button>
        </div>
<!-- =========================
     STOPWATCH
========================= -->
<section class="stopwatch-section">

    <div class="stopwatch-container">

        <div class="stopwatch-header">
            <p class="section-label">STOPWATCH</p>
            <h2>Precision Timer</h2>
        </div>

        <div class="stopwatch-display" id="stopwatchDisplay">
            00:00:00.00
        </div>

        <div class="stopwatch-controls">

            <button
                id="startStopwatch"
                class="stopwatch-btn primary"
                type="button">
                START
            </button>

            <button
                id="lapStopwatch"
                class="stopwatch-btn"
                type="button"
                disabled>
                LAP
            </button>

            <button
                id="resetStopwatch"
                class="stopwatch-btn"
                type="button">
                RESET
            </button>

        </div>

        <div class="lap-section">

            <div class="lap-heading">
                <span>LAPS</span>
                <span id="lapCount">0</span>
            </div>

            <div
                id="lapHistory"
                class="lap-history">
            </div>

        </div>

    </div>

</section>
    </main>

    <script src="script.js"></script>

</body>
</html>
