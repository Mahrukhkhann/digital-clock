<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <div class="clock">

            <div class="brand">VINTAGE CLOCK</div>

            <div id="time">00:00:00</div>

            <div id="period">AM</div>

            <div id="date">Monday, January 1, 2026</div>

        </div>
<!-- Alarm Section -->

<section class="alarm">

    <div class="section-title">
        ALARM
    </div>

    <div class="alarm-form">

        <input
            type="time"
            id="alarmTime"
        >

        <button id="setAlarm">
            SET ALARM
        </button>

    </div>

    <div class="alarm-status" id="alarmStatus">
        No alarm set
    </div>

    <button
        id="stopAlarm"
        class="stop-alarm"
        hidden
    >
        STOP ALARM
    </button>

</section>


        <div class="controls">
            <button id="formatBtn">12H</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
