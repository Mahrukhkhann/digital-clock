<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <div class="clock">

            <div class="brand">VINTAGE CLOCK</div>

            <div id="time">00:00:00</div>

            <div id="period">AM</div>

            <div id="date">Monday, January 1, 2026</div>

        </div>
<!-- Alarm Section -->

<section class="alarm">

    <div class="section-title">
        ALARM
    </div>

    <div class="alarm-form">

        <input
            type="time"
            id="alarmTime"
        >

        <button id="setAlarm">
            SET ALARM
        </button>

    </div>

    <div class="alarm-status" id="alarmStatus">
        No alarm set
    </div>

    <button
        id="stopAlarm"
        class="stop-alarm"
        hidden
    >
        STOP ALARM
    </button>

</section>


        <div class="controls">
            <button id="formatBtn">12H</button>
        </div>
<!-- =========================
     STOPWATCH
========================= -->
<section class="stopwatch-section">

    <div class="stopwatch-container">

        <div class="stopwatch-header">
            <p class="section-label">STOPWATCH</p>
            <h2>Precision Timer</h2>
        </div>

        <div class="stopwatch-display" id="stopwatchDisplay">
            00:00:00.00
        </div>

        <div class="stopwatch-controls">

            <button
                id="startStopwatch"
                class="stopwatch-btn primary"
                type="button">
                START
            </button>

            <button
                id="lapStopwatch"
                class="stopwatch-btn"
                type="button"
                disabled>
                LAP
            </button>

            <button
                id="resetStopwatch"
                class="stopwatch-btn"
                type="button">
                RESET
            </button>

        </div>

        <div class="lap-section">

            <div class="lap-heading">
                <span>LAPS</span>
                <span id="lapCount">0</span>
            </div>

            <div
                id="lapHistory"
                class="lap-history">
            </div>

        </div>

    </div>

</section>


                            <!--  COUNTDOWN TIMER -->

<section class="countdown-section">

    <div class="countdown-container">

        <div class="countdown-header">
            <p class="section-label">COUNTDOWN</p>
            <h2>Focus Timer</h2>
        </div>

        <!-- Time Inputs -->

        <div class="countdown-inputs">

            <div class="countdown-input-group">

                <label for="countdownHours">
                    HOURS
                </label>

                <input
                    type="number"
                    id="countdownHours"
                    min="0"
                    max="99"
                    value="0"
                    inputmode="numeric"
                >

            </div>


            <span class="countdown-separator">:</span>


            <div class="countdown-input-group">

                <label for="countdownMinutes">
                    MINUTES
                </label>

                <input
                    type="number"
                    id="countdownMinutes"
                    min="0"
                    max="59"
                    value="5"
                    inputmode="numeric"
                >

            </div>


            <span class="countdown-separator">:</span>


            <div class="countdown-input-group">

                <label for="countdownSeconds">
                    SECONDS
                </label>

                <input
                    type="number"
                    id="countdownSeconds"
                    min="0"
                    max="59"
                    value="0"
                    inputmode="numeric"
                >

            </div>

        </div>


        <!-- Countdown Display -->

        <div
            id="countdownDisplay"
            class="countdown-display">

            00:05:00

        </div>


        <!-- Status -->

        <div
            id="countdownStatus"
            class="countdown-status">

            Ready

        </div>


        <!-- Controls -->

        <div class="countdown-controls">

            <button
                id="startCountdown"
                class="countdown-btn primary"
                type="button">

                START

            </button>


            <button
                id="pauseCountdown"
                class="countdown-btn"
                type="button"
                disabled>

                PAUSE

            </button>


            <button
                id="resetCountdown"
                class="countdown-btn"
                type="button">

                RESET

            </button>

        </div>

    </div>

</section>

    </main>

    <script src="script.js"></script>

</body>
</html>
