<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vintage Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-container">

        <div class="clock">

            <div class="brand">VINTAGE CLOCK</div>

            <div id="time">00:00:00</div>

            <div id="period">AM</div>

            <div id="date">Monday, January 1, 2026</div>

        </div>

        <div class="controls">
            <button id="formatBtn">12H</button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
